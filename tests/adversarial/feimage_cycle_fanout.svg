<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40">
  <!-- feImage fan-out through a cycle fix_recursive_fe_image does not cut:
       f1 links g2 eight times, f2 links g1 eight times; 8^k renders unless
       the render budget stops it (T67). -->
  <filter id="f1" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse">
    <feImage href="#g2" result="r0"/>
    <feImage href="#g2" result="r1"/>
    <feImage href="#g2" result="r2"/>
    <feImage href="#g2" result="r3"/>
    <feImage href="#g2" result="r4"/>
    <feImage href="#g2" result="r5"/>
    <feImage href="#g2" result="r6"/>
    <feImage href="#g2" result="r7"/>
    <feMerge><feMergeNode in="r0"/><feMergeNode in="r7"/></feMerge>
  </filter>
  <filter id="f2" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse">
    <feImage href="#g1" result="r0"/>
    <feImage href="#g1" result="r1"/>
    <feImage href="#g1" result="r2"/>
    <feImage href="#g1" result="r3"/>
    <feImage href="#g1" result="r4"/>
    <feImage href="#g1" result="r5"/>
    <feImage href="#g1" result="r6"/>
    <feImage href="#g1" result="r7"/>
  </filter>
  <g id="g1" filter="url(#f1)"><rect width="100" height="100" fill="red"/></g>
  <g id="g2" filter="url(#f2)"><rect x="50" width="100" height="100" fill="blue"/></g>
</svg>
