<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!-- T70: feTile's crop must clip to the canvas rather than blow up on a
       huge declared sub-region; feDisplacementMap's cost must not grow with
       `scale`; gamma's `powF32` fallback must not grow with `exponent`. -/-->
  <filter id="tile"><feFlood x="0" y="0" width="1e9" height="1e9"/><feTile/></filter>
  <filter id="disp">
    <feFlood flood-color="#8040c0" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1e30" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="gamma">
    <feComponentTransfer><feFuncR type="gamma" amplitude="1e30" exponent="1e9" offset="0"/></feComponentTransfer>
  </filter>
  <rect x="10" y="10" width="100" height="100" fill="teal" filter="url(#tile)"/>
  <rect x="150" y="10" width="100" height="100" fill="teal" filter="url(#disp)"/>
  <rect x="290" y="10" width="100" height="100" fill="teal" filter="url(#gamma)"/>
</svg>
