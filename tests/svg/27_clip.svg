<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <!-- userSpaceOnUse (the default): the union of two children -->
    <clipPath id="star">
      <path d="M 50 8 L 62 40 L 96 40 L 68 60 L 79 92 L 50 72 L 21 92 L 32 60 L 4 40 L 38 40 Z"/>
      <circle cx="50" cy="50" r="14"/>
    </clipPath>
    <!-- evenodd clip-rule leaves the middle of the star open -->
    <clipPath id="starEO">
      <path clip-rule="evenodd"
            d="M 50 8 L 62 40 L 96 40 L 68 60 L 79 92 L 50 72 L 21 92 L 32 60 L 4 40 L 38 40 Z"/>
    </clipPath>
    <!-- objectBoundingBox units, on the grid the renderer's fixed point represents
         exactly (quarters of the box) -->
    <clipPath id="bboxClip" clipPathUnits="objectBoundingBox">
      <rect x="0.125" y="0.25" width="0.75" height="0.5"/>
      <circle cx="0.5" cy="0.5" r="0.25"/>
    </clipPath>
    <!-- transform on the clipPath element itself -->
    <clipPath id="spun" transform="translate(150 0) rotate(30)">
      <rect x="0" y="0" width="60" height="60"/>
    </clipPath>
    <!-- a clipPath whose child carries its own clip-path: an intersection -->
    <clipPath id="ring">
      <circle cx="50" cy="50" r="46"/>
    </clipPath>
    <clipPath id="halfRing">
      <rect x="0" y="0" width="100" height="50" clip-path="url(#ring)"/>
    </clipPath>
    <!-- a clip-path on the clipPath element: also an intersection -->
    <clipPath id="selfClipped" clip-path="url(#ring)">
      <rect x="20" y="0" width="70" height="100"/>
    </clipPath>
    <!-- a child that contributes nothing but keeps the clip valid -->
    <clipPath id="withHidden">
      <rect x="10" y="10" width="80" height="80"/>
      <circle cx="50" cy="50" r="60" visibility="hidden"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="300" height="300" fill="#f8f4ec"/>

  <!-- row 1 -->
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="100" height="100" fill="#264653" clip-path="url(#star)"/>
  </g>
  <g transform="translate(100 0)">
    <rect x="0" y="0" width="100" height="100" fill="#2a9d8f" clip-path="url(#starEO)"/>
  </g>
  <g transform="translate(200 0)">
    <!-- objectBoundingBox scales to the clipped element's own user-space box -->
    <rect x="12" y="12" width="76" height="76" fill="#e76f51" clip-path="url(#bboxClip)"/>
  </g>

  <!-- row 2 -->
  <g transform="translate(0 100)">
    <!-- clip on a group: it applies to every descendant shape -->
    <g clip-path="url(#star)">
      <rect x="0" y="0" width="100" height="50" fill="#e9c46a"/>
      <rect x="0" y="50" width="100" height="50" fill="#264653"/>
    </g>
  </g>
  <g transform="translate(100 100)">
    <rect x="0" y="0" width="100" height="100" fill="#8a4fff" clip-path="url(#halfRing)"/>
  </g>
  <g transform="translate(200 100)">
    <rect x="0" y="0" width="100" height="100" fill="#1d7874" clip-path="url(#selfClipped)"/>
  </g>

  <!-- row 3 -->
  <g transform="translate(0 200)">
    <!-- the clip applies to the stroke as well as the fill -->
    <circle cx="50" cy="50" r="30" fill="#f4a261" stroke="#264653" stroke-width="10"
            clip-path="url(#withHidden)"/>
  </g>
  <g transform="translate(100 200)">
    <!-- a transform on the clipPath element, and one on the clipped element -->
    <g transform="translate(0 20) scale(0.8)">
      <rect x="0" y="0" width="100" height="100" fill="#b5179e" clip-path="url(#spun)"/>
    </g>
  </g>
  <g transform="translate(200 200)">
    <!-- an unresolvable reference is ignored, so this renders whole; the one
         below it is clipped by a rotated copy of the same star -->
    <rect x="5" y="5" width="90" height="90" fill="#cdd7d6" clip-path="url(#missing)"/>
    <g transform="rotate(20 50 50)">
      <rect x="0" y="0" width="100" height="100" fill="#003049" clip-path="url(#star)"/>
    </g>
  </g>
</svg>
