<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300" height="300" viewBox="0 0 300 300">
  <!-- T67: feImage linking to elements of the same document. -->
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#2a6"/>
      <stop offset="1" stop-color="#26c"/>
    </linearGradient>
    <g id="inh" fill="#c52" stroke="#333" stroke-width="3">
      <circle id="dot" cx="30" cy="30" r="24"/>
    </g>
    <rect id="grad" width="100" height="60" rx="12" fill="url(#lg)" transform="rotate(10)"/>
    <g id="pair" opacity="0.7">
      <rect x="0" y="0" width="50" height="50" fill="#fc3"/>
      <rect x="25" y="25" width="50" height="50" fill="#39c"/>
    </g>
    <use id="u" xlink:href="#pair" x="10"/>
    <rect id="blurred" width="60" height="60" fill="#96c" filter="url(#blur)"/>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="f1" x="0" y="0" width="1" height="1">
      <feImage xlink:href="#grad"/>
    </filter>
    <filter id="f2" filterUnits="userSpaceOnUse" x="150" y="10" width="140" height="130">
      <feImage xlink:href="#dot" x="170" y="30" result="d"/>
      <feMerge result="m"><feMergeNode in="SourceGraphic"/><feMergeNode in="d"/></feMerge>
      <feImage href="#u" x="200" y="60" result="u"/>
      <feBlend in="u" in2="m" mode="multiply"/>
    </filter>
    <filter id="f3" x="-0.2" y="-0.2" width="1.4" height="1.4">
      <feImage xlink:href="#blurred"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="f4" primitiveUnits="objectBoundingBox">
      <feImage xlink:href="#missing"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="110" height="110" fill="red" filter="url(#f1)"/>
  <rect x="160" y="20" width="120" height="110" fill="#ddd" filter="url(#f2)"/>
  <rect x="30" y="160" width="100" height="100" fill="black" filter="url(#f3)"
        transform="rotate(20 80 210)"/>
  <circle cx="220" cy="220" r="50" fill="red" filter="url(#f4)"/>
  <circle cx="220" cy="220" r="50" fill="none" stroke="black"/>
</svg>
