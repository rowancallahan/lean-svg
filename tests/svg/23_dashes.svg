<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <rect width="400" height="400" fill="#fdfdfb"/>
  <!-- every cap style, even-count pattern, open paths -->
  <g fill="none" stroke="#1d3557" stroke-width="10" stroke-dasharray="20 12">
    <path d="M 20 24 H 190" stroke-linecap="butt"/>
    <path d="M 210 24 H 380" stroke-linecap="square"/>
    <path d="M 20 48 H 190" stroke-linecap="round"/>
    <path d="M 210 48 L 380 62" stroke-linecap="butt"/>
  </g>
  <!-- odd count (repeated to six), and offsets: 0, positive, negative, past the sum -->
  <g fill="none" stroke="#e63946" stroke-width="8" stroke-dasharray="14 7 4">
    <path d="M 20 76 H 190"/>
    <path d="M 210 76 H 380" stroke-dashoffset="9"/>
    <path d="M 20 96 H 190" stroke-dashoffset="-13"/>
    <path d="M 210 96 H 380" stroke-dashoffset="133"/>
  </g>
  <!-- zero entries: dots for round and square caps, nothing for butt; and N 0 -->
  <g fill="none" stroke="#2a9d8f" stroke-width="12" stroke-dasharray="0 26">
    <path d="M 24 124 H 184" stroke-linecap="round"/>
    <path d="M 214 124 H 374" stroke-linecap="square"/>
    <path d="M 24 146 H 184" stroke-linecap="butt"/>
  </g>
  <path d="M 214 146 H 374" fill="none" stroke="#2a9d8f" stroke-width="12"
        stroke-dasharray="30 0" stroke-linecap="butt"/>
  <!-- closed subpaths: the pattern runs across the closing segment -->
  <rect x="24" y="172" width="150" height="86" fill="none" stroke="#6a4c93"
        stroke-width="9" stroke-dasharray="26 14" stroke-linejoin="miter"/>
  <rect x="42" y="190" width="114" height="50" fill="none" stroke="#f4a261"
        stroke-width="7" stroke-dasharray="17 9" stroke-dashoffset="-6"
        stroke-linejoin="round" stroke-linecap="square"/>
  <polygon points="264,170 330,190 374,246 300,262 226,232" fill="none" stroke="#6a4c93"
           stroke-width="8" stroke-dasharray="21 11" stroke-linejoin="bevel"/>
  <path d="M 246 196 L 300 182 L 348 218 L 286 240 Z" fill="none" stroke="#457b9d"
        stroke-width="6" stroke-dasharray="13 8 3" stroke-dashoffset="5"/>
  <!-- curves: a cubic and a circle -->
  <path d="M 24 322 C 60 268, 104 380, 148 316 S 196 268, 210 330" fill="none"
        stroke="#264653" stroke-width="7" stroke-dasharray="16 10" stroke-linecap="butt"/>
  <circle cx="288" cy="330" r="40" fill="none" stroke="#264653" stroke-width="7"
          stroke-dasharray="12 8"/>
  <!-- dashed hairlines, open and closed, plus a sub-pixel width -->
  <path d="M 24 282 H 240" fill="none" stroke="#000000" stroke-width="1"
        stroke-dasharray="8 5"/>
  <path d="M 24 288 H 240" fill="none" stroke="#000000" stroke-width="1"
        stroke-dasharray="8 5" stroke-dashoffset="4" stroke-linecap="square"/>
  <path d="M 24 294 H 240" fill="none" stroke="#000000" stroke-width="0.5"
        stroke-dasharray="6 3 1"/>
  <rect x="250" y="276" width="126" height="26" fill="none" stroke="#000000"
        stroke-width="1" stroke-dasharray="9 6"/>
  <!-- dashes live in user space: the transform scales them with the geometry -->
  <g transform="translate(348 96) rotate(28) scale(1.6)" fill="none" stroke="#8ac926"
     stroke-width="5" stroke-dasharray="11 6">
    <path d="M -18 -40 L -18 12 L 16 12"/>
  </g>
  <!-- patterns that mean "no dashing": none, a negative entry, a zero sum -->
  <g fill="none" stroke="#adb5bd" stroke-width="5">
    <path d="M 24 388 H 130" stroke-dasharray="none"/>
    <path d="M 146 388 H 252" stroke-dasharray="14 -7 4"/>
    <path d="M 268 388 H 374" stroke-dasharray="0 0 0"/>
  </g>
</svg>
