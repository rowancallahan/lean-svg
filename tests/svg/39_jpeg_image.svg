<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300">
  <rect width="400" height="300" fill="#fdfdfb"/>
  <!-- embedded JPEGs (T62 decoder; drawn once T63's <image> lands) -->
  <!-- baseline 4:2:0, natural size and scaled up -->
  <image x="10" y="10" width="60" height="45" href="data:image/jpeg;base64,"/>
  <image x="90" y="10" width="180" height="135" xlink:href="data:image/jpeg;base64,"/>
  <!-- progressive grayscale -->
  <image x="10" y="160" width="120" height="90" href="data:image/jpeg;base64,"/>
  <!-- 4:4:4 with restart markers, non-uniform box (default xMidYMid meet) -->
  <image x="150" y="160" width="240" height="120" href="data:image/jpeg;base64,"/>
</svg>
