<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- T70: feTile, feDisplacementMap, feComponentTransfer's gamma -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4020"/>
      <stop offset="1" stop-color="#2040ff"/>
    </linearGradient>
    <filter id="tile">
      <feFlood flood-color="seagreen" x="30" y="30" width="10" height="10"/>
      <feOffset dx="5" dy="5"/>
      <feTile/>
    </filter>
    <filter id="disp" x="-20%" y="-20%" width="140%" height="140%">
      <feDisplacementMap in="SourceGraphic" in2="SourceGraphic" scale="24"
        xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="gammaUp">
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1" exponent="2" offset="0"/>
        <feFuncG type="gamma" amplitude="1" exponent="2" offset="0"/>
        <feFuncB type="gamma" amplitude="1" exponent="2" offset="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="gammaDown">
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1.4" exponent="0.5" offset="0"/>
        <feFuncG type="gamma" amplitude="1.4" exponent="0.5" offset="0"/>
        <feFuncB type="gamma" amplitude="1.4" exponent="0.5" offset="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="30" y="30" width="110" height="110" filter="url(#tile)"/>
  <rect x="160" y="30" width="110" height="110" fill="url(#grad)" filter="url(#disp)"/>
  <rect x="30" y="160" width="110" height="110" fill="#406090" filter="url(#gammaUp)"/>
  <rect x="160" y="160" width="110" height="110" fill="#406090" filter="url(#gammaDown)"/>
</svg>
