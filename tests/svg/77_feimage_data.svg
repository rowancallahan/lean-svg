<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300" height="200" viewBox="0 0 300 200">
  <!-- T77: feImage with an embedded data: image (the href T67 stubbed out,
       now wired to T63's decoders). Same 16x12 PNG as 46_image.svg. -->
  <defs>
    <filter id="f1" x="0" y="0" width="1" height="1">
      <feImage xlink:href="data:image/png;base64,"/>
    </filter>
    <filter id="f2" x="0" y="0" width="1" height="1">
      <feImage preserveAspectRatio="none" image-rendering="optimizeSpeed"
        xlink:href="data:image/png;base64,"/>
    </filter>
    <filter id="f3">
      <feImage x="20%" y="20%" width="60%" height="60%"
        xlink:href="data:image/png;base64,"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="fmissing">
      <!-- No href, and href that is neither a same-document link nor a
           data: URI: both stay the dummy (transparent) primitive. -->
      <feImage/>
      <feImage xlink:href="not-a-data-uri.png" result="x"/>
      <feMerge><feMergeNode/><feMergeNode in="x"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="red" filter="url(#f1)"/>
  <rect x="110" y="10" width="80" height="80" fill="red" filter="url(#f2)"/>
  <rect x="210" y="10" width="80" height="80" fill="red" filter="url(#f3)"/>
  <rect x="10" y="110" width="80" height="80" fill="green" filter="url(#fmissing)"/>
  <rect x="10" y="110" width="80" height="80" fill="none" stroke="black"/>
</svg>
