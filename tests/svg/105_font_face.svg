<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- T105: fonts embedded in the file with @font-face and data: URLs (WOFF 2.0
  with transformed glyf/loca/hmtx, WOFF 1.0, TrueType), subsets of the resvg
  test suite's Noto fonts (SIL OFL 1.1).  resvg ignores @font-face and falls
  through each family list to the same installed font, so the renders agree.
  A non-data: URL is never loaded: the "Remote" face does not exist. -->
  <style>
    @font-face { font-family: "Doc Serif"; src: url(missing.woff2) format('woff2'), url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: DocSans; src: url(data:font/woff;base64,) format('woff'); }
    @font-face { font-family: DocSans; font-weight: bold; src: url("data:font/ttf;base64,") format("truetype"); }
    @font-face { font-family: Remote; src: url(https://example.com/remote.woff2) format('woff2'); }
    .s { font-family: 'Doc Serif', 'Noto Serif'; }
  </style>
  <text class="s" x="10" y="40" font-size="28">WOFF2 serif: Quartz 123</text>
  <text x="10" y="90" font-size="28" font-family="DocSans, 'Noto Sans'">WOFF1 sans: Quartz 123</text>
  <text x="10" y="140" font-size="28" font-weight="bold" font-family="DocSans, 'Noto Sans'">TrueType bold: Quartz</text>
  <text x="10" y="185" font-size="28" font-family="Remote, 'Noto Sans'">remote ignored</text>
</svg>
