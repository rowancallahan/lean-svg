<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="70">
  <rect width="280" height="70" fill="#fdfdfb"/>
  <!-- embedded GIF (T78 decoder), first frame / LZW; drawn via Image.lean's -->
  <!-- .gif dispatch. Plain palette, palette + transparent index, and the -->
  <!-- same image interlaced (GIF's own 4-pass row interlacing). -->
  <image x="10" y="10" width="80" height="64" href="data:image/gif;base64,"/>
  <image x="100" y="10" width="80" height="64" href="data:image/gif;base64,"/>
  <image x="190" y="10" width="80" height="64" href="data:image/gif;base64,"/>
</svg>
