<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="200" viewBox="0 0 300 200">
  <!-- T85: context-fill/context-stroke with paint servers resolve against the
       use's own transform and content bbox, not the painted child's. -->
  <linearGradient id="lg" gradientTransform="rotate(30)">
    <stop offset="0" stop-color="gold"/>
    <stop offset="0.5" stop-color="crimson"/>
    <stop offset="1" stop-color="navy"/>
  </linearGradient>
  <radialGradient id="rg" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="45">
    <stop offset="0" stop-color="white"/>
    <stop offset="1" stop-color="seagreen"/>
  </radialGradient>
  <pattern id="pt" patternUnits="userSpaceOnUse" width="12" height="12">
    <rect width="6" height="6" fill="teal"/>
    <rect x="6" y="6" width="6" height="6" fill="orange"/>
  </pattern>
  <defs>
    <g id="g1">
      <rect x="10" y="10" width="80" height="35" fill="context-fill" stroke="context-stroke" stroke-width="4"/>
      <circle cx="30" cy="70" r="18" transform="translate(40 0) scale(0.9)" fill="context-fill"/>
      <g transform="rotate(15 50 50)">
        <path d="M 15 85 L 85 85 L 50 60 Z" fill="context-stroke"/>
      </g>
    </g>
    <g id="g2">
      <use xlink:href="#g1" fill="context-stroke" stroke="url(#lg)"/>
    </g>
  </defs>
  <use xlink:href="#g1" fill="url(#lg)" stroke="url(#rg)"/>
  <use xlink:href="#g1" x="100" fill="url(#pt)" stroke="url(#lg)"/>
  <use xlink:href="#g2" transform="translate(200 10) scale(0.9)" stroke="url(#rg)"/>
  <use xlink:href="#g1" transform="translate(0 100)" fill="url(#rg)" stroke="black"/>
  <use xlink:href="#g1" transform="translate(100 100) scale(0.9)" fill="url(#lg)" stroke="url(#pt)"/>
</svg>
