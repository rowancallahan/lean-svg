<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <!-- T99: feOffset is clipped to its subregion (default: its input's), as the
       spec, the suite and Chromium do; resvg leaves it unclipped -->
  <filter id="sub"><feFlood flood-color="seagreen" x="0" y="0" width="80" height="80"/><feOffset dx="30" dy="30"/></filter>
  <filter id="own"><feOffset dx="20" dy="10" x="170" y="20" width="70" height="120"/></filter>
  <rect x="10" y="10" width="120" height="120" filter="url(#sub)"/>
  <rect x="160" y="20" width="100" height="100" fill="steelblue" filter="url(#own)"/>
</svg>
