<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300" viewBox="0 0 400 300">
  <!-- T63: embedded raster images. The PNG is stored (uncompressed) so any
       conforming PNG decoder handles it. -->
  <defs>
    <clipPath id="c"><circle cx="330" cy="70" r="45"/></clipPath>
    <mask id="m"><rect x="20" y="170" width="160" height="110" fill="white"/><circle cx="100" cy="225" r="30" fill="black"/></mask>
    <image id="img" width="16" height="12" xlink:href="data:image/png;base64,"/>
  </defs>
  <rect width="400" height="300" fill="#eef"/>
  <image x="10" y="10" width="160" height="120" href="data:image/png;base64,"/>
  <image x="180" y="10" width="80" height="120" image-rendering="pixelated" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,"/>
  <image x="270" y="10" width="120" height="120" opacity="0.6" clip-path="url(#c)" xlink:href="data:image/png;base64,"/>
  <image x="20" y="170" width="160" height="110" preserveAspectRatio="none" mask="url(#m)" xlink:href="data:image/png;base64,"/>
  <image x="0" y="0" width="100" transform="translate(260 150) rotate(20)" style="image-rendering:smooth" xlink:href="data:image/png;base64,"/>
  <use href="#img" x="200" y="260" style="image-rendering:optimizeSpeed"/>
  <image x="300" y="260" width="30" height="30" xlink:href="image.png"/>
  <image x="340" y="260" width="30" height="30" xlink:href="data:image/png;base64,%%%notbase64"/>
</svg>
