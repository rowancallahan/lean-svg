<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <title>T80: transform-origin on gradientTransform/patternTransform</title>
  <defs>
    <!-- gradientUnits=objectBoundingBox: origin still resolves against the
         viewport, not the shape's own bounding box. -->
    <radialGradient id="rg" gradientTransform="scale(2)" transform-origin="center">
      <stop offset="0" stop-color="black"/>
      <stop offset="0.375" stop-color="green"/>
    </radialGradient>
    <!-- gradientUnits=userSpaceOnUse, an off-centre origin keyword pair. -->
    <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="0"
                     gradientTransform="rotate(45)" transform-origin="left top">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <!-- patternUnits=objectBoundingBox. -->
    <pattern id="patt-obb" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox"
             width="1" height="1" patternTransform="scale(2)" transform-origin="center">
      <rect x="0" y="0" width="0.5" height="0.5" fill="grey"/>
      <rect x="0.5" y="0.5" width="0.5" height="0.5" fill="green"/>
    </pattern>
    <!-- patternUnits=userSpaceOnUse, a length pair rather than keywords. -->
    <pattern id="patt-uou" patternUnits="userSpaceOnUse" width="80" height="80"
              patternTransform="scale(2)" transform-origin="40 40">
      <rect x="20" y="20" width="20" height="20" fill="grey"/>
      <rect x="40" y="40" width="20" height="20" fill="green"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="60" height="60" fill="url(#rg)"/>
  <rect x="90" y="10" width="60" height="60" fill="url(#lg)" stroke="black"/>
  <rect x="170" y="10" width="60" height="60" fill="url(#patt-obb)" stroke="darkblue"/>
  <rect x="250" y="10" width="60" height="60" fill="url(#patt-uou)" stroke="darkblue"/>
</svg>
