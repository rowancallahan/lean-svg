<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <title>T82: stroke-width percentage, patternTransform skewX</title>
  <defs>
    <!-- a sheared pattern tile whose content overflows the tile bounds,
         same shape of bug as paint-servers/pattern/text-child.svg -->
    <pattern id="sheared" patternUnits="userSpaceOnUse" width="20" height="12"
             patternTransform="skewX(15)">
      <rect x="0" y="0" width="50" height="6" fill="#2a9d8f"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="100" height="100" fill="none" stroke="#e63946" stroke-width="10%"/>
  <rect x="130" y="10" width="100" height="100" fill="url(#sheared)" stroke="black"/>
</svg>
