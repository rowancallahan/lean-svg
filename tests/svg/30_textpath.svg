<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#fdfdfb"/>
  <defs>
    <path id="arc" d="M 60 220 A 140 140 0 0 1 340 220" transform="translate(0 50)"/>
    <path id="two" d="M 20 330 L 150 280 M 250 280 L 380 330 Z"/>
    <rect id="box" x="150" y="190" width="100" height="50"/>
  </defs>
  <!-- a stroked path doubles as the text's baseline -->
  <path id="wave" d="M 20 90 C 80 20 140 20 200 90 S 320 160 380 90" fill="none" stroke="#bbb"/>
  <text font-family="Noto Sans" font-size="22" fill="#135">
    <textPath href="#wave">Text <tspan fill="#c33" dy="-6">rides</tspan> a wave<tspan dy="6"> along</tspan></textPath>
  </text>
  <!-- percent startOffset, anchor, per-glyph rotate, referenced transform -->
  <text font-family="Noto Sans" font-size="18" fill="#363" text-anchor="middle">
    <textPath xlink:href="#arc" startOffset="50%" rotate="0 10 -10">centred on the arc</textPath>
  </text>
  <!-- linear text before and after, subpaths, Z, glyphs past the end dropped -->
  <text font-family="Noto Sans" font-size="16" fill="#633" x="30" y="385">before
    <textPath xlink:href="#two" startOffset="12">two subpaths and a close; the rest is dropped</textPath>
    after</text>
  <!-- a basic shape, negative startOffset, letter-spacing -->
  <text font-family="Noto Sans" font-size="14" fill="#336" letter-spacing="2">
    <textPath xlink:href="#box" startOffset="-20">around a small rectangle, again</textPath>
  </text>
</svg>
