<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- T92: CSS basic shapes in clip-path, each on a 80x60 rect with a
       20px stroke; default reference box is stroke-box. -->
  <g fill="green" stroke="blue" stroke-width="20">
    <rect x="20" y="20" width="80" height="60" clip-path="circle()"/>
    <rect x="150" y="20" width="80" height="60" clip-path="circle(40% at right bottom) fill-box"/>
    <rect x="280" y="20" width="80" height="60" clip-path="ellipse(closest-side farthest-side at 30% 40%)"/>
    <rect x="20" y="110" width="80" height="60" clip-path="inset(5px 10% 15px 20px round 10px 20px / 5px)"/>
    <rect x="150" y="110" width="80" height="60" clip-path="fill-box rect(auto 90% 70% 10px round 25%)"/>
    <rect x="280" y="110" width="80" height="60" style="clip-path: xywh(10px 5px 70% 80% round 50%)"/>
    <rect x="20" y="200" width="80" height="60" clip-path="polygon(evenodd, 0 0, 100% 0, 50% 100%, 0 30%, 100% 30%)"/>
    <rect x="150" y="200" width="80" height="60" clip-path="path(nonzero, 'M10 0 L100 50 L0 100 Z') fill-box"/>
    <g clip-path="stroke-box" transform="translate(280 200)">
      <rect width="40" height="30"/>
      <rect x="45" y="35" width="35" height="25" clip-path="circle(20px at left 10px top 5px)"/>
    </g>
  </g>
  <rect x="0" y="280" width="400" height="20" fill="orange" clip-path="inset(0 50% 0 0) view-box"/>
</svg>
