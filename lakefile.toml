name = "lean-svg"
version = "0.1.0"
defaultTargets = ["lean-svg", "fontdump", "pngdump", "jpegdump", "shapedump"]

# No dependencies on purpose: the trusted computing base is Lean core only.
# (No mathlib, no FFI, no C libraries.)

[[lean_lib]]
name = "LeanSvg"

[[lean_exe]]
name = "lean-svg"
root = "Main"

# Debug/oracle tool for LeanSvg.Font (T25). Reads a font path off the
# command line (its only IO); lean-svg does not link it or the embedded
# font data in LeanSvg/Fonts/*.lean.
[[lean_exe]]
name = "fontdump"
root = "FontDump"

# Debug/oracle tool for LeanSvg.PngDecode (T61). Reads PNG paths off the
# command line; lean-svg does not link it.
[[lean_exe]]
name = "pngdump"
root = "PngDump"

# Debug/oracle tool for LeanSvg.JpegDecode (T62): decodes JPEG files given on
# the command line to raw RGBA; lean-svg does not link it.
[[lean_exe]]
name = "jpegdump"
root = "JpegDump"

# Debug/oracle tool for LeanSvg.Bidi and LeanSvg.Shape (T93): shapes runs with
# an embedded font and runs the bidi algorithm on lines read from stdin, for
# tests/check_shape.py and tests/check_bidi.py; lean-svg does not link it.
[[lean_exe]]
name = "shapedump"
root = "ShapeDump"
