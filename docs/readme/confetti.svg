<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <!-- Original artwork for the lean-svg README. Apache-2.0, same as the project.
       Exercises: linear + radial gradients, group opacity as a layer, blend
       modes, dashes, arcs, clipPath, text with the embedded Noto Sans. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3f6"/>
      <stop offset="1" stop-color="#f7fbfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#fb8500" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="band">
      <rect x="0" y="150" width="400" height="70" rx="10"/>
    </clipPath>
  </defs>

  <rect width="400" height="260" fill="url(#sky)"/>
  <circle cx="318" cy="66" r="52" fill="url(#glow)"/>

  <!-- overlapping translucent confetti, drawn as one group so the group
       opacity composites once rather than per shape -->
  <g opacity="0.85">
    <circle cx="44" cy="40" r="15" fill="#e63946" fill-opacity="0.75"/>
    <circle cx="70" cy="58" r="11" fill="#457b9d" fill-opacity="0.75"/>
    <circle cx="58" cy="24" r="8" fill="#2a9d8f" fill-opacity="0.8"/>
    <rect x="96" y="28" width="22" height="9" rx="2" fill="#023047" fill-opacity="0.7" transform="rotate(24 96 28)"/>
    <rect x="132" y="46" width="18" height="8" rx="2" fill="#e76f51" fill-opacity="0.8" transform="rotate(-38 132 46)"/>
    <rect x="160" y="20" width="14" height="14" rx="3" fill="#8ecae6" transform="rotate(15 160 20)"/>
    <circle cx="196" cy="52" r="9" fill="#ffb703" fill-opacity="0.85"/>
    <circle cx="222" cy="33" r="6" fill="#2a9d8f"/>
  </g>

  <!-- blend modes over the warm glow -->
  <g style="mix-blend-mode: multiply" opacity="0.75">
    <circle cx="296" cy="84" r="26" fill="#8ecae6"/>
    <circle cx="332" cy="92" r="20" fill="#ffb703"/>
  </g>

  <!-- arcs: a ribbon built from A commands -->
  <path d="M 30 132 A 60 40 0 0 1 150 132 A 60 40 0 0 0 270 132"
        fill="none" stroke="#457b9d" stroke-width="5" stroke-linecap="round"/>
  <path d="M 30 146 A 60 40 0 0 1 150 146 A 60 40 0 0 0 270 146"
        fill="none" stroke="#e76f51" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="9 7"/>

  <!-- a clipped band: the wave is wider than the clip rectangle -->
  <g clip-path="url(#band)">
    <path d="M -20 196 C 60 160 120 232 200 196 S 340 160 420 196 L 420 240 L -20 240 Z"
          fill="#2a9d8f" fill-opacity="0.55"/>
    <path d="M -20 208 C 60 172 120 244 200 208 S 340 172 420 208 L 420 240 L -20 240 Z"
          fill="#023047" fill-opacity="0.45"/>
  </g>

  <text x="200" y="240" text-anchor="middle" font-family="Noto Sans" font-size="15"
        fill="#1d3557" letter-spacing="1.5">lean-svg</text>
</svg>
