name: CI

on:
  push:
  pull_request:

# No secrets are used anywhere in this workflow, but a fork PR still can't
# run privileged steps, so keep the guard for the day one is added.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: invariants
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install Lean
        run: bash scripts/install-lean.sh

      - name: lake build
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      - name: Invariants (axioms, two effects, no stray IO, mechanical checks)
        run: bash scripts/check-theorems.sh

  tests:
    name: tests
    needs: invariants
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Cache resvg/usvg 0.48.1
        id: cache-resvg
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/resvg
            ~/.cargo/bin/usvg
          key: resvg-0.48.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Lean
        run: bash scripts/install-lean.sh

      - name: Install resvg/usvg 0.48.1 (oracle)
        run: |
          command -v resvg >/dev/null || time cargo install resvg --version 0.48.1 --locked
          command -v usvg >/dev/null || time cargo install usvg --version 0.48.1 --locked

      - name: Install Python deps
        run: pip install -q numpy pillow

      - name: Clone resvg test suite
        run: |
          mkdir -p tests/corpora
          git clone --depth 1 https://github.com/linebender/resvg-test-suite \
            tests/corpora/resvg-test-suite

      - name: lake build
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      - name: Elaborate Lean test files
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          for f in tests/*.lean; do
            echo "-- lake env lean $f"
            lake env lean "$f"
          done

      - name: run_tests.py
        run: python3 tests/run_tests.py

      - name: run_tiles.py
        run: python3 tests/run_tiles.py

      - name: run_adversarial.py
        run: python3 tests/run_adversarial.py
